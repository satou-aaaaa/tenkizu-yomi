<style>
/* 紙の地図：海は淡い青、陸は生成り、通った道は朱色の線 */
:root{
  --bg:#e3ecf3; --paper:#fffdf7; --ink:#26323a; --ink2:#53626b; --line:#26323a22;
  --land:#f6f0e1; --edge:#8a8170; --sea:#cfe1ea; --route:#c43f26; --route2:#9b3220; --go:#2f8a5b; --goal:#d2492f; --nb:#ffe7a3; --gold:#d79b2c;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:800;font-size:21px;margin:0;letter-spacing:.04em}
h1 small{font-size:12px;letter-spacing:0;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.dots{display:flex;gap:6px;flex:1;max-width:120px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots{align-items:center}.dots i.on{background:var(--route);height:10px;border-radius:4px}.dots i.done{background:var(--ink)}
/* まちがえた問題は中が空の枠（色だけで分けない。WCAG 1.4.1） */
.dots i.miss{background:transparent;box-shadow:inset 0 0 0 2px var(--route);height:8px}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--route);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--route2)}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--route2)}
button.main.alt{background:#2f5d7a;box-shadow:0 4px 0 #1d3d52}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--route2);display:inline-flex;align-items:center;min-height:44px}
/* 天気図 */
.map{background:#f4f8fb;border-radius:16px;overflow:hidden;border:2px solid #2f5d7a33}
.map svg{display:block;width:100%;height:auto}
.q{font-size:18px;font-weight:800;text-align:center;margin:0;line-height:1.5}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch.c8{grid-template-columns:repeat(4,1fr)}
.ch button{all:unset;box-sizing:border-box;cursor:pointer;min-height:52px;border-radius:14px;background:var(--paper);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;text-align:center;padding:4px;box-shadow:0 3px 0 #26323a18}
.ch.c8 button{font-size:15px}
.ch button.ok{background:#d8f0e0;border-color:var(--go)}
.ch button.ng{background:#fadcd5;border-color:var(--route)}
.ch button:disabled{cursor:default}
/* 答え合わせの印：正解 ✓・選んだまちがい ✕（色だけで分けない） */
.ch button{position:relative}
.ch button .mk{position:absolute;top:3px;right:6px;font-size:16px;line-height:1;font-weight:800}
.ch button.ok .mk{color:#1f6b45}.ch button.ng .mk{color:var(--route2)}
.ch button.ng{border-style:dashed}
.why{background:var(--paper);border-left:4px solid #2f5d7a;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.7;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:11px;color:var(--ink2)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:22px}
.verdict{background:var(--paper);border:2px solid #2f5d7a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #26323a1c;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:22px;font-weight:800}
.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}
.stars .off{color:#26323a26}
/* ホーム */
.title{font-weight:800;font-size:36px;letter-spacing:.06em;text-align:center;margin:4px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--route2)}
.share{background:var(--paper);border-radius:14px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.big{font-weight:800;font-size:24px;text-align:center;margin:0}
.res{display:flex;flex-direction:column;gap:6px}
.res div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 県帳 */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px;min-height:44px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box}
.dex div small{font-size:11px;color:var(--ink2)}
.dex .no{opacity:.45}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--route2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
/* 答えたあとに重ねる風の矢印（流れが見える）と、聞いた地点の太い矢印・天気の印 */
.wl{animation:wl .5s ease-out both}
@keyframes wl{from{opacity:0}to{opacity:1}}
.wb{stroke-dasharray:240;animation:draw .7s .15s ease-out both}
@keyframes draw{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
.ch button.ok{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.legend .wleg{color:#b5361f;font-weight:800}
/* 実績・カレンダー */
.badge{background:var(--route);color:#fff;border-radius:9px;padding:1px 6px;font-size:12px}
.life{font-size:18px;letter-spacing:2px;white-space:nowrap}.life .off{opacity:.25}
.achnext{text-align:center;font-size:13px;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:14px;font-weight:800;color:var(--route2);margin:0;animation:up .35s ease-out}
.agrp{font-size:13px;color:var(--ink2);margin:4px 0 -6px;font-weight:800;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:28px 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:20px;text-align:center}
.ach b{grid-area:nm;font-size:15px}.ach small{grid-area:cd;color:var(--ink2);font-size:12px;line-height:1.4}
.ach .pg{grid-area:pg;font-size:13px;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:#2f5d7a}
.ach.got{background:#e4eef5;border-color:#2f5d7a66}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.45}
.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:17px}.calnav .sub{flex:0 0 72px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1}
.cal .c i{font-style:normal;font-size:9px;letter-spacing:-.05em;color:var(--gold)}
.cal .c.p1{background:#e4eef5}.cal .c.p2{background:#b9d2e3}.cal .c.p3{background:#2f5d7a;color:#fff;border-color:#1d3d52}.cal .c.p3 i{color:#ffe08a}
.cal .c.late{background:transparent;border:1.5px dashed #2f5d7a;color:#2f5d7a}
.cal .c.miss{cursor:pointer;border:1.5px dashed var(--route);color:var(--route2);background:#fff}
.cal .c.miss i{color:var(--route)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:9px;color:var(--route);font-weight:800}
.cal .c.p3 .hd{color:#ffe08a}
.cal .c.off{visibility:hidden}
.calleg{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--ink2)}
.calleg span{display:inline-flex;align-items:center;gap:4px}.calleg em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
@media (max-width:360px){.row>.sub{font-size:14px;padding:0 8px}}
[hidden]{display:none!important}
/* 色の見分けを助ける（html.a11y-cvd）：正解は青・まちがいは橙に替え、前線・高低もカラーユニバーサルデザインの組に */

html.a11y-cvd .ch button.ng{background:#fbe6c6;border-color:#D55E00}
html.a11y-cvd .ch button.ok .mk{color:#00507e}html.a11y-cvd .ch button.ng .mk{color:#9a3d00}
html.a11y-cvd .ch button .mk{font-size:17px}

html.a11y-cvd .wb{stroke:#D55E00}

/* all:unset のボタン（カレンダーのます目など）でも枠が消えないよう、いちばん最後に強く書く（2026-11-04 CodeRabbit） */

</style>

  if (!LAND) LAND = M.P.map((p) => `<path d="${p[1]}"/>`).join("");
  const centers = m.centers.filter((c) => c.x > X0 && c.x < X0 + VW && c.y > Y0 && c.y < Y0 + VH).map((c) => `<text x="${c.x}" y="${c.y}" font-size="46" class="c${c.k}" fill="${c.k === "H" ? "#2f6fd0" : "#d2492f"}" font-weight="800" text-anchor="middle" dominant-baseline="middle">${c.k === "H" ? "高" : "低"}</text><text x="${c.x}" y="${c.y + 38}" font-size="24" fill="#26323a" text-anchor="middle">${c.p}</text>`).join("");
  const edge = m.centers.filter((c) => !(c.x > X0 && c.x < X0 + VW && c.y > Y0 && c.y < Y0 + VH)).map((c) => { const x = Math.max(X0 + 30, Math.min(X0 + VW - 30, c.x)), y = Math.max(Y0 + 30, Math.min(Y0 + VH - 30, c.y)); return `<text x="${x}" y="${y}" font-size="42" class="c${c.k}" fill="${c.k === "H" ? "#2f6fd0" : "#d2492f"}" font-weight="800" text-anchor="middle" dominant-baseline="middle">${c.k === "H" ? "高" : "低"}</text>`; }).join("");
  const pts = (q.pts || []).map((n, i) => { const c = G.city(n); return `<circle cx="${c[1]}" cy="${c[2]}" r="11" fill="#ffd36b" stroke="#26323a" stroke-width="3"/><text x="${c[1] + 14}" y="${c[2] - 12}" font-size="32" font-weight="800" fill="#26323a" paint-order="stroke" stroke="#fff" stroke-width="5">${n}</text>`; }).join("");
  return `<svg viewBox="${X0} ${Y0} ${VW} ${VH}" role="img" aria-label="${mapLabel(q)}"><rect x="${X0}" y="${Y0}" width="${VW}" height="${VH}" fill="#dce9f3"/><g fill="#eadfbf" stroke="#eadfbf" stroke-width="1.5">${LAND}</g>${isobars(m)}${m.fronts.map(frontSvg).join("")}${centers}${edge}${pts}<text x="${X0 + VW - 14}" y="${Y0 + 30}" font-size="26" text-anchor="end" fill="#5b6f80">↑北</text></svg>`;
}
// 答えたあとに重ねる絵：天気図じゅうの風の矢印（高気圧から吹き出し、低気圧へ吹き込む流れ）と、聞いた地点の太い矢印・天気の印。
// 矢印は gen.js の wind（答えと同じ計算）から描く。長さは風の強さ。答える前には出さない（答えを言わない）
const WX = { 晴れ: "☀", 雨: "☂", 雪: "❄" };
// 説明：その問題の地点に合わせて一言足す（風の強さは2地点の比べ、風向きは地図の矢印を見てもらう）
const whyOf = (q) => q.t === "strong" ? `${q.ans}のほうが等圧線の間がせまい。${q.why}` : q.t === "wind" ? `${q.why}地図の赤い矢印が${q.pts[0]}の風です。` : q.why;
function windLayer(q) {
  const m = q.map, f = (v) => v.toFixed(1), pts = (q.pts || []).map((n) => G.city(n)).filter(Boolean);
  const arrow = (x, y, w, big) => {
    const L = big ? Math.max(18, Math.min(70, 14 + w.speed * 560)) : Math.max(10, Math.min(40, 6 + w.speed * 300)), r = w.deg * Math.PI / 180, dx = -Math.sin(r), dy = Math.cos(r), h = big ? 13 : 6;
    const x0 = x - dx * L / 2, y0 = y - dy * L / 2, x1 = x + dx * L / 2, y1 = y + dy * L / 2, px = -dy * h * 0.6, py = dx * h * 0.6;
    return `M${f(x0)},${f(y0)}L${f(x1)},${f(y1)}M${f(x1 - dx * h + px)},${f(y1 - dy * h + py)}L${f(x1)},${f(y1)}L${f(x1 - dx * h - px)},${f(y1 - dy * h - py)}`;
  };
  let small = "";
  for (let y = Y0 + 40; y < Y0 + VH; y += 64) for (let x = X0 + 40; x < X0 + VW; x += 64) {
    if (pts.some((c) => Math.hypot(c[1] - x, c[2] - y) < 46) || m.centers.some((c) => Math.hypot(c.x - x, c.y + 14 - y) < 52)) continue; // 地点の名前・高・低の字にかぶせない
    const w = G.wind(m, x, y); if (w.speed < 0.006) continue;
    small += arrow(x, y, w, false);
  }
  const big = pts.map((c) => arrow(c[1], c[2], G.wind(m, c[1], c[2]), true)).join("");
  const wx = q.t === "weather" && WX[q.ans] && pts[0] ? `<text x="${pts[0][1] - 34}" y="${pts[0][2] + 46}" font-size="46" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6">${WX[q.ans]}</text>` : "";
  return `<g class="wl" id="wl"><path d="${small}" fill="none" stroke="#2f5d7a" stroke-opacity=".5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${big ? `<path d="${big}" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path class="wb" d="${big}" fill="none" stroke="#d2492f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>` : ""}${wx}</g>`;
}

    <h1 class="title">天気図よみ</h1>
    <div class="map" aria-hidden="true">${mapHtml(sample)}</div>
    <p class="lead" data-a11y-say>等圧線・高気圧・前線から、風と天気を読む。<br>だれでも同じ1日5問。</p>
    ${done ? `<div class="share">今日の結果　${done.r.map(sq).join("")} ${nOk(done)}/${done.r.length}</div>` : ""}
    <button class="main" id="go-d">${done ? "今日の結果を見る" : rd ? `続きから（${rd.res.length + 1}問目）` : `今日の5問を読む <small>#${dayNo(k)}</small>`}</button>
    ${done ? `<button class="main alt" id="go-h">${hdone ? "上級の結果を見る" : rh ? "上級の続きから" : "上級：8方位の風向きと天気の5問"}</button>` : ""}
    ${(() => { const re = s.runs.e && !doneOf(s.runs.e) ? s.runs.e : null; return `<button class="main alt" id="go-e">${re ? `とことんの続きから（${re.res.length + 1}問目）` : "とことん：何問続けて読める？"}${s.ebest ? ` <small>自己ベスト ${s.ebest}問</small>` : ""}</button>`; })()}
    <div class="row"><button class="sub" id="go-p">練習（何度でも）</button><button class="sub" id="go-dex">読めた数 ${s.ok}</button></div>

    <div class="stats">${streak(s.days) >= 1 ? `<div><b>${streak(s.days)}</b><small>連続の日</small></div>` : `<div><b>${tally(s).perfect}</b><small>全問正解の日</small></div>`}<div><b>${Object.keys(s.days).length}</b><small>遊んだ日</small></div><div><b>${s.ok}</b><small>正解</small></div></div>
    <p class="rank">称号：${rankOf(s.ok)}${nr ? `（あと${nr[0] - s.ok}問で${nr[1]}）` : ""}</p>

  $("go-d").onclick = () => (k !== todayKey() ? home() : done ? result("d", k) : startRun("d")); // 画面を開いたまま0時を過ぎたら、今日の状態に描き直す
  if ($("go-h")) $("go-h").onclick = () => (hdone ? result("h", k) : k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない

function practiceMenu() {
  app.innerHTML = `<header><button class="icon" id="back" aria-label="もどる">←</button><h1>練習<small>今日の記録には入りません（読めた数には入ります）</small></h1><span></span></header>

    <div class="lv">${Object.keys(NAME).map((t) => `<button class="sub" data-t="${t}" style="min-height:64px">${NAME[t]}</button>`).join("")}</div>${footer()}`;

function startRun(mode, opt) {
  const k = todayKey();
  let ng = false;
  save((s) => {
    // あとから：取りこぼした日（過去7日・まだ遊んでいない）だけ。その日の今日の5問と同じ問題を出す
    // 途中経過は日付ごとに runs["a:日付"] に持つ（別の日を始めても、前の日の途中は消さない）
    if (mode === "a") {
      const ra = s.runs[runKey("a", opt)];
      if (ra && ra.date === opt && !doneOf(ra)) return; // 続きから
      if (!lateDays(s, k).includes(opt)) { ng = true; return; }
      for (const m of Object.keys(s.runs)) if (m.startsWith("a:") && !s.runs[m] && m.slice(2) < new Date(Date.parse(k) - 14 * 864e5).toISOString().slice(0, 10)) delete s.runs[m]; // 終えて空になった古い日の入れ物は片付ける
      s.runs[runKey("a", opt)] = { mode, date: opt, list: dailyList(opt), res: [], id: "a" + opt, a0: achGot(s) };
      return;
    }
    if (mode === "e") { const re = s.runs.e; if (re && !doneOf(re)) return; s.runs.e = { mode, date: k, list: endlessList(), res: [], life: ELIFE, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), a0: achGot(s) }; return; } // とことん：途中なら続きから（日をまたいでも続けられる）
    if (mode !== "p" && s.runs[mode] && s.runs[mode].date === k) return; // 続きから
    if ((mode === "d" && s.days[k]) || (mode === "h" && s.hdays[k])) return; // 別のタブで今日の分を終えていたら、もう一度は始めない（ホームに戻る）
    const list = mode === "d" ? dailyList(k) : mode === "h" ? hardList(k) : [0, 1, 2, 3, 4].map(() => ({ seed: Math.floor(Math.random() * 2 ** 31), t: opt, h: 0 }));
    s.runs[mode] = { mode, date: k, list, res: [], id: Date.now().toString(36), a0: achGot(s) };
  });
  if (ng) return cal();
  MODE = runKey(mode, opt);
  play();
}

// 今の問題：{ i, date, id, it, q, done }
let cur = null;
function play() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  const i = run.res.length;
  if (doneOf(run)) return finish();
  const it = run.list[i], q = qOf(it), en = run.mode === "e", nok = run.res.filter(Boolean).length;
  cur = { i, date: run.date, id: run.id, it, q, done: false, hard: run.mode === "h" };
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="もどる">←</button>
      ${en ? `<span class="life" id="life" aria-label="まちがえてよい回数 ${run.life}">${lifeStr(run.life)}</span><span style="font-size:13px;color:var(--ink2)">${ELV[it.lv]}・${NAME[it.t]} ${i + 1}問目${s.ebest ? `（ベスト ${s.ebest}）` : ""}</span></header>` : `<div class="dots" role="img" aria-label="${i + 1}問目／${run.list.length}問（正解${nok}・まちがい${i - nok}）">${run.list.map((_, j) => `<i class="${j < i ? (run.res[j] ? "done" : "miss") : j === i ? "on" : ""}"></i>`).join("")}</div>
      <span style="font-size:13px;color:var(--ink2)">${run.mode === "h" ? "上級・" : run.mode === "p" ? "練習・" : run.mode === "a" ? `${md(run.date)}・` : ""}${NAME[it.t]} ${i + 1}/${run.list.length}</span></header>`}
    <div class="map" id="mp">${mapHtml(q)}</div>
    <div class="legend"><span><b style="color:#1f5cb8">高</b> 高気圧</span><span><b style="color:#b5361f">低</b> 低気圧</span><span>線：等圧線（4hPaごと）</span><span class="wleg" id="wleg" hidden>→ 風の向き（長いほど強い）</span></div>
    <p class="q" data-a11y-say>${esc(q.ask)}</p>
    <div class="ch${q.choices.length === 8 ? " c8" : ""}" id="ch">${q.choices.map((c) => `<button data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div id="after"></div>
    ${en ? `<p class="note">まちがえると🎫を1枚使います（🎫が無いときにまちがえると終わり）。</p><button class="sub" id="quit" style="width:100%">ここで降りる（${nok}問で終える）</button>` : ""}`;
  $("back").onclick = home;
  if ($("quit")) $("quit").onclick = () => finish();
  $("ch").querySelectorAll("button").forEach((b) => (b.onclick = () => answer(b.dataset.c)));
  window.scrollTo(0, 0);
}
const lifeStr = (n) => "🎫".repeat(Math.max(0, n)) + `<span class="off">${"🎫".repeat(Math.max(0, ELIFE - n))}</span>`;
const same = (r) => r && cur && r.date === cur.date && r.id === cur.id && r.res.length === cur.i && !r.over;
function answer(c) {
  if (cur.done) return;
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  cur.done = true;
  const ok = c === cur.q.ans; buzz(ok ? [10, 40, 10] : 40);
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; r.res.push(ok ? 1 : 0); if (ok) { s.ok++; s.got[cur.it.t] = (s.got[cur.it.t] || 0) + 1; } if (r.mode === "e" && !ok) { if ((r.life || 0) > 0) r.life--; else r.over = true; } }); // とことんはまちがい1回で🎫1枚。🎫が無いときにまちがえたら終わり
  $("ch").querySelectorAll("button").forEach((b) => { b.disabled = true; const mk = b.dataset.c === cur.q.ans ? ["ok", "✓", "正解"] : b.dataset.c === c ? ["ng", "✕", "まちがい"] : null; if (mk) { b.classList.add(mk[0]); b.insertAdjacentHTML("beforeend", `<span class="mk" aria-hidden="true">${mk[1]}</span>`); b.setAttribute("aria-label", `${b.dataset.c}（${mk[2]}${b.dataset.c === c ? "・えらんだ答え" : ""}）`); } });
  // 答え合わせ：天気図に風の流れと、聞いた地点の風・天気を重ねる（なぜその答えかが絵で分かる）
  const svg = $("mp") && $("mp").querySelector("svg"); if (svg && !$("wl")) { svg.insertAdjacentHTML("beforeend", windLayer(cur.q)); $("wleg").hidden = false; }
  const r = s.runs[MODE], fin = doneOf(r), en = r && r.mode === "e";
  if (en && $("life")) { $("life").innerHTML = lifeStr(r.life || 0); $("life").setAttribute("aria-label", "まちがえてよい回数 " + (r.life || 0)); }
  if (en && $("quit")) $("quit").hidden = true;
  const tk = en && !ok ? `<p class="note" id="etk">${r.over ? "🎫が無いので、とことんはここまで" : `🎫を1枚使いました（のこり${r.life}枚）`}</p>` : "";
  $("after").innerHTML = `<div class="verdict" role="status" data-a11y-say><div class="hd">${ok ? "正解！" : `答えは「${esc(cur.q.ans)}」`}</div>${tk}${cur.hard ? "" : `<p class="why">${esc(whyOf(cur.q))}</p>`}<button class="main" id="next">${fin ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur.done) $("next").scrollIntoView({ behavior: calm() ? "auto" : "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  if (run.mode === "e") return endFinish(run);
  let first = false, newAch = [];
  const rec = { r: run.res.slice() };
  save((s2) => {
    first = bank(s2, run);
    // 別のタブで同じモードの新しい回が始まっていたら、それは消さない
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null;
    // この回のあいだに取れた実績（始めたときの一覧と比べる。前の版で始めた回は出さない）
    if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id));
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec }, newAch);
  // あとからの回が記録されなかった（同じ日の今日の5問が先に終わっていた）ときも、答えた結果は見せる（記録はしない）
  if (run.mode === "a" && !first && !(load().adays || {})[run.date]) return result("a", run.date, false, rec, newAch);
  result(run.mode, run.date, first, null, newAch);
}
// とことんの終わり：正解した数を自己ベストと比べる（他の人との順位は出さない・シェアしない）
function endFinish(run) {
  const n = run.res.filter(Boolean).length, miss = run.res.length - n, lv = run.res.length ? run.list[run.res.length - 1].lv : 0; let prev = 0, newAch = [];
  save((s2) => { prev = s2.ebest || 0; s2.ebest = Math.max(prev, n); const c = s2.runs.e; if (c && c.id === run.id) s2.runs.e = null; if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id)); });
  const s = load(), best = n > prev && n > 0;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>天気図よみ<small>とことん</small></h1><span></span></header>
    <p class="big" id="eres">${n}問 正解</p>
    <p class="note" id="ebest">${best ? "🎉 自己ベスト更新！" : s.ebest ? `自己ベスト ${s.ebest}問${s.ebest >= n ? `（あと${s.ebest - n + 1}問で更新）` : ""}` : "1問正解すると自己ベストが残ります"}</p>
    <p class="note">${ELV[lv]}まで進みました・まちがい${miss}回</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    <button class="main" id="go-e">もう一度とことん</button>
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">読めた数を見る</button></div>
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-e").onclick = () => startRun("e"); $("go-p").onclick = practiceMenu; $("go-dex").onclick = dex;
  window.scrollTo(0, 0);
}
// 共有の文：問題（地名・答え）は出さない。正解🟩・はずれ🟥
const sq = (x) => (x ? "🟩" : "🟥");
function shareText(mode, k, rec) {
  const n = rec.r.filter(Boolean).length;
  return `天気図よみ${mode === "h" ? " 上級" : ""} #${dayNo(k)} ${md(k)}\n${rec.r.map(sq).join("")} ${n}/${rec.r.length}`;
}
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, newAch = []) {
  const s = load();
  const list = mode === "p" ? prec.list : mode === "d" || mode === "a" ? dailyList(k) : hardList(k);
  const rec = prec || bookOf(s, mode)[k], unsaved = mode === "a" && !!prec;
  if (!rec) return home();
  const n = rec.r.filter(Boolean).length, all = n === rec.r.length, text = shareText(mode, k, rec), late = mode === "a";
  const showKofi = first && mode !== "p" && !late && all && !s.kofi[k + mode]; // あとから遊んだ日には出さない
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>天気図よみ<small>${mode === "d" ? `今日の5問 #${dayNo(k)}` : late ? `#${dayNo(k)} ${md(k)} あとから` : mode === "h" ? "上級" : "練習"}</small></h1><span></span></header>
    <p class="big">${all ? "全問正解！" : `${rec.r.length}問中 ${n}問 正解`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 次の実績「${nx.name}」まで あと${nx.left}（${nx.n}/${nx.goal}）</p>` : ""; })()}
    <div class="res">${list.map((it, j) => { const q = qOf(it); return `<div><span>${NAME[it.t]}：${esc(q.ask)}<br><small style="color:var(--ink2)">答え：${esc(q.ans)}${mode === "h" ? `　${esc(q.why)}` : ""}</small></span><b>${rec.r[j] ? "○" : "×"}</b></div>`; }).join("")}</div>
    ${late ? `<p class="note">${unsaved ? "この日は今日の5問の記録があるので、あとからの記録には残しません。" : "あとから遊んだ日は、カレンダーに ↺ で残ります（連続の日には数えません）。"}</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    ${mode !== "p" && !late ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟩正解　🟥はずれ<br>次の5問まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode !== "p" ? `<button class="main" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}問）` : ""}</button>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：8方位の風向きと天気に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">読めた数を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  if ($("go-e")) $("go-e").onclick = () => startRun("e");
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

function dex() {
  const s = load();
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>読めた数<small>正解 ${s.ok}問</small></h1><span></span></header>
    <p class="note">問題の種類ごとの正解の数です。</p>
    <div class="res">${Object.keys(NAME).map((t) => `<div><span>${NAME[t]}</span><b>${s.got[t] || 0}問</b></div>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}

function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1><span></span></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic">🏅</span><b>${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home;
  bindFooter(); window.scrollTo(0, 0);
}
// 遊んだ日のカレンダー：今日の5問の日は正解の数で色を濃く（★）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)).toISOString().slice(0, 7);
const lvOf = (rec) => { const n = nOk(rec); return allOk(rec) ? 3 : n >= 3 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = (s.adays || {})[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" aria-label="${m}月${d}日 ${nOk(rec)}問正解">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${st >= 1 ? `<small>連続 ${st}日</small>` : ""}</h1><span></span></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="calleg"><span><em style="background:#2f5d7a"></em>★★★ 全問正解</span><span><em style="background:#b9d2e3"></em>★★ 3〜4問</span><span><em style="background:#e4eef5;border:1px solid #26323a22"></em>★ 0〜2問</span><span>↺ あとから</span><span>上 上級</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5問をあとから遊べます（過去7日まで・連続の日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home;
  $("prev").onclick = () => cal(ymAdd(ym, -1));
  $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym)))); // 開いたまま0時を過ぎて8日前になった日は始めない
  bindFooter(); window.scrollTo(0, 0);
}

window.__tk = { mode: () => MODE, endlessList, ELIFE, ERAMP, G, dailyList, hardList, qOf, todayKey, dayNo, shareText, streak, load, lateDays, ACH, achGot, nextAch, tally, cal, windLayer, runKey, cur: () => cur, answer: (c) => answer(c), play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
